<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>B2B Lead Generation Engine</title>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f9;--card:#fff;--ink:#14213d;--mut:#586380;--line:#dde2ec;--side:#14213d;--acc:#2456d6;--accbg:#e4ebfc;--ok:#157347;--okbg:#e3f4ea;--warn:#a85a00;--warnbg:#fdeed8;--bad:#b42318;--badbg:#fde8e6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--card:#172038;--ink:#e8ecf7;--mut:#9ba7c5;--line:#2a3555;--side:#0a0f1c;--acc:#7da2ff;--accbg:#1c2c5a;--ok:#68d391;--okbg:#17321f;--warn:#f6ad55;--warnbg:#3a2c14;--bad:#fc8181;--badbg:#3d1d1d}}
:root[data-theme="dark"]{--bg:#0e1424;--card:#172038;--ink:#e8ecf7;--mut:#9ba7c5;--line:#2a3555;--side:#0a0f1c;--acc:#7da2ff;--accbg:#1c2c5a;--ok:#68d391;--okbg:#17321f;--warn:#f6ad55;--warnbg:#3a2c14;--bad:#fc8181;--badbg:#3d1d1d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Source Sans 3",system-ui,sans-serif;display:grid;grid-template-columns:230px 1fr;min-height:100vh}
@media(max-width:820px){body{grid-template-columns:1fr}}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
aside.side{background:var(--side);color:#dfe6f7;padding:18px 12px;position:sticky;top:0;height:100vh;overflow:auto}
@media(max-width:820px){aside.side{position:static;height:auto}}
.side h3{font-size:12px;font-weight:600;color:#8f9bbd;margin:16px 8px 4px}.side button{display:block;width:100%;text-align:left;background:none;border:0;color:inherit;padding:7px 10px;border-radius:6px}.side button[aria-current=page]{background:rgba(255,255,255,.14);font-weight:600}.side button:hover{background:rgba(255,255,255,.08)}
.logo{font-weight:700;font-size:17px;padding:0 8px}.logo small{display:block;font-weight:400;color:#9aa6c8;font-size:12px}
main{padding:22px 26px 60px;min-width:0}h1{font-size:25px;margin:0 0 2px}h2{font-size:16px;margin:0 0 10px}.sub{color:var(--mut);margin:0 0 16px;max-width:75ch}
.banner{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;font-size:13px}.chip{background:var(--warnbg);color:var(--warn);padding:2px 10px;border-radius:4px;font-weight:600}.chip.n{background:var(--accbg);color:var(--acc)}
.grid{display:grid;gap:14px}.k{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}.two{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
button.kpi{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px 14px}button.kpi:hover{border-color:var(--acc)}.kpi b{display:block;font-size:23px;line-height:1.2}.kpi span{color:var(--mut);font-size:13px}
h4{margin:18px 0 8px;font-size:14px;color:var(--mut)}
.row{display:grid;grid-template-columns:170px 1fr 70px;gap:8px;align-items:center;margin:6px 0;font-size:14px}.track{background:var(--line);height:12px;border-radius:4px;overflow:hidden}.fill{height:100%;background:var(--acc)}
button.row{background:none;border:0;width:100%;padding:2px 0;text-align:left}button.row.sel .track{outline:2px solid var(--acc)}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}th{color:var(--mut);font-size:13px;font-weight:600}tbody tr{cursor:pointer}tbody tr:hover,tr.sel{background:var(--accbg)}
.tag{display:inline-block;padding:1px 8px;border-radius:4px;font-size:12px;font-weight:600;background:var(--line);color:var(--mut)}.Hot,.High,.Opportunity,.Qualified{background:var(--okbg);color:var(--ok)}.Warm,.Medium,.Demo-Booked{background:var(--warnbg);color:var(--warn)}.Disqualified,.Low{background:var(--badbg);color:var(--bad)}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:end}.tools input,.tools select{padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--card)}label{font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:2px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:14px;align-items:start}@media(max-width:1000px){.split{grid-template-columns:1fr}}
.btn{background:var(--acc);color:var(--card);border:0;padding:7px 14px;border-radius:6px;font-weight:600}.btn.g{background:none;color:var(--ink);border:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}.chips button{border:1px solid var(--line);background:var(--card);border-radius:99px;padding:3px 12px;font-size:14px}.chips button[aria-pressed=true]{background:var(--acc);color:var(--card);border-color:var(--acc)}
dl{display:grid;grid-template-columns:105px 1fr;gap:5px 10px;margin:0;font-size:14px}dt{color:var(--mut)}dd{margin:0}
.big{font-size:40px;font-weight:700;line-height:1}.empty{padding:26px;text-align:center;color:var(--mut)}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:6px}
</style></head><body>
<aside class="side"><div class="logo">B2B Lead Generation Engine<small>ICP Intelligence, Prospecting, Outreach &amp; Pipeline</small></div><nav id="nav" aria-label="Primary"></nav></aside>
<main id="app" aria-live="polite"></main><div id="toast" class="toast" role="status" hidden></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
const NAV=[["dash","Dashboard"],["Lead generation"],["icp","ICP Builder"],["acct","Account Intelligence"],["cont","Contact Intelligence"],["lead","Lead Pipeline"],["Campaigns"],["camp","Campaign Overview & Email"],["Analytics"],["funnel","Funnel Analytics"],["qual","Lead Quality"],["pipe","Pipeline Impact"]];
const PAGES=Object.fromEntries(NAV.filter(n=>n.length>1));
// ---- demo data ----
const ICPOPT={geo:["India","USA","Middle East","South Africa","Uganda"],ind:["Pharmaceutical","Healthcare","Manufacturing","FMCG","BFSI","Enterprise Services"],size:["50–200","201–500","501–1,000","1,001–5,000","5,000+"],sig:["Digital transformation","Document workflow challenges","Compliance requirements","Manual approval processes","eSignature adoption","Procurement digitization","Data privacy requirements","Enterprise workflow modernization"]};
const ICP={geo:["India","USA","Middle East"],ind:["Pharmaceutical","Healthcare","BFSI"],size:["501–1,000","1,001–5,000","5,000+"],sig:["Compliance requirements","Digital transformation","Procurement digitization","Manual approval processes"]};
const A=[["Aurelia Pharma Ltd","Pharmaceutical","India","1,001–5,000","$200M–$500M","Compliance requirements"],["Northbridge Health Systems","Healthcare","USA","5,000+","$1B+","Digital transformation"],["Kestrel Manufacturing","Manufacturing","India","501–1,000","$50M–$200M","Manual approval processes"],["Meridian Bank Group","BFSI","Middle East","5,000+","$1B+","Procurement digitization"],["Vantage Life Sciences","Pharmaceutical","USA","1,001–5,000","$500M–$1B","Compliance requirements"],["Savanna Foods","FMCG","South Africa","501–1,000","$50M–$200M","Document workflow challenges"],["Orion Diagnostics","Healthcare","India","201–500","$10M–$50M","eSignature adoption"],["Helix Biologics","Pharmaceutical","India","501–1,000","$50M–$200M","Data privacy requirements"],["Crescent Insurance","BFSI","India","1,001–5,000","$200M–$500M","Enterprise workflow modernization"],["Lakeview Services","Enterprise Services","USA","201–500","$10M–$50M","Document workflow challenges"],["Gulf Industrial Co.","Manufacturing","Middle East","1,001–5,000","$500M–$1B","Procurement digitization"],["Nile Retail Group","FMCG","Uganda","50–200","$5M–$10M","Manual approval processes"]].map((a,i)=>({id:i,name:a[0],ind:a[1],geo:a[2],size:a[3],rev:a[4],sig:a[5]}));
const ST=["New","Researched","Contacted","Engaged","Replied","Qualified","Demo Booked","Opportunity","Nurture","Disqualified"],LEADST=["Replied","Qualified","Demo Booked","Opportunity","Nurture","Disqualified"];
const CP=["Pharma QA & Compliance Heads (India)","Healthcare & Pharma CIO Outreach (USA)","BFSI Procurement Digitization","Manufacturing Operations Workflow","Middle East Enterprise IT"];
const DEC=["CIO","CISO","Chief Digital Officer","Compliance Head","Procurement Head","QA Head"];
const CT=[["Priya Nair","Head of QA",0,"QA Head","Opportunity",91,0],["Rohan Mehta","CIO",0,"CIO","Demo Booked",86,0],["Daniel Brooks","Chief Digital Officer",1,"Chief Digital Officer","Opportunity",88,1],["Sarah Lindqvist","CIO",1,"CIO","Qualified",84,1],["Anil Verma","Operations Head",2,"Operations Head","Replied",66,3],["Kavita Rao","IT Head",2,"IT Head","Qualified",81,3],["Omar Al-Farsi","Procurement Head",3,"Procurement Head","Demo Booked",83,2],["Layla Haddad","CISO",3,"CISO","Engaged",62,4],["Michael Chen","Compliance Head",4,"Compliance Head","Qualified",87,1],["Emily Carter","QA Head",4,"QA Head","Replied",71,1],["Thabo Ndlovu","Operations Head",5,"Operations Head","Contacted",38,3],["Zanele Dube","Procurement Head",5,"Procurement Head","Nurture",52,3],["Meera Iyer","IT Head",6,"IT Head","Replied",68,0],["Arjun Kapoor","Operations Head",6,"Operations Head","Contacted",35,0],["Sneha Pillai","Compliance Head",7,"Compliance Head","Qualified",82,0],["Vikram Joshi","CIO",7,"CIO","Engaged",58,0],["Rahul Bansal","Procurement Head",8,"Procurement Head","Demo Booked",80,2],["Nisha Kulkarni","HR Head",8,"HR Head","Disqualified",22,2],["Jason Reed","IT Head",9,"IT Head","Researched",30,1],["Hannah Wu","Operations Head",9,"Operations Head","New",20,1],["Khalid Mansoor","Procurement Head",10,"Procurement Head","Engaged",60,4],["Fatima Al-Zahra","IT Head",10,"IT Head","Contacted",41,4],["Peter Okello","Operations Head",11,"Operations Head","Disqualified",18,3],["Grace Namutebi","HR Head",11,"HR Head","New",25,3]].map((c,i)=>({id:i,name:c[0],title:c[1],acct:c[2],persona:c[3],status:c[4],score:c[5],camp:c[6]}));
// campaign: contacts,sent,delivered,opened,clicked,replied,pos,meetings,leads,qual,demos,opps,pipeline($K)
const CAMP=[["Active",620,620,598,262,61,33,19,14,52,26,10,5,310],["Active",540,540,516,206,44,26,15,10,41,21,8,4,240],["Completed",480,480,462,170,38,21,11,8,34,16,6,2,120],["Active",420,420,402,141,29,16,8,6,26,12,4,2,100],["Paused",360,360,346,118,24,12,6,4,19,9,3,1,50]].map((a,i)=>({id:i,name:CP[i],status:a[0],contacts:a[1],sent:a[2],del:a[3],open:a[4],click:a[5],reply:a[6],pos:a[7],meet:a[8],leads:a[9],qual:a[10],demos:a[11],opps:a[12],pipe:a[13]*1000}));
const T={};["contacts","sent","del","open","click","reply","pos","meet","leads","qual","demos","opps","pipe"].forEach(k=>T[k]=CAMP.reduce((s,c)=>s+c[k],0));
T.acc=1240;T.pros=3850;T.eng=T.click+T.reply;
const pct=(a,b)=>b?(a/b*100).toFixed(1)+"%":"–",fm=n=>n>=1e6?"$"+(n/1e6).toFixed(2)+"M":n>=1e3?"$"+Math.round(n/1e3)+"K":"$"+n,cls=s=>s.replace(/ /g,"-");
const tag=t=>`<span class="tag ${cls(t)}">${esc(t)}</span>`,band=s=>s>=80?"Hot":s>=60?"Warm":s>=40?"Nurture":"Low Priority";
const FUN=[["Target accounts",T.acc,"Accounts matching the ICP"],["Prospects",T.pros,"Researched people at target accounts"],["Contacts reached",T.contacts,"Received at least one touch"],["Engaged",T.eng,"Clicked or replied"],["Leads",T.leads,"Showed buying intent"],["Qualified leads",T.qual,"Passed qualification criteria"],["Demos",T.demos,"Meetings booked with sales"],["Opportunities",T.opps,"Sales-accepted deals"],["Pipeline",T.pipe,"Open pipeline value"]];
const S={page:"dash",q:"",ind:"",geo:"",pri:"",st:"",sel:null,camp:0,stage:4};
// ICP fit (live from ICP builder)
const fit=a=>(ICP.ind.includes(a.ind)?30:0)+(ICP.geo.includes(a.geo)?20:0)+(ICP.size.includes(a.size)?20:0)+(ICP.sig.includes(a.sig)?30:0);
const pri=a=>fit(a)>=80?"High":fit(a)>=50?"Medium":"Low";
const aStatus=a=>{const c=CT.filter(x=>x.acct===a.id);return c.sort((x,y)=>ST.indexOf(y.status)-ST.indexOf(x.status))[0].status};
const toast=m=>{const t=$("#toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2200)};
const bars=(rows,max,sel)=>rows.map(([l,v,t,k])=>`<${k!=null?"button":"div"} class="row ${sel===k?"sel":""}" ${k!=null?`data-stage="${k}"`:""}><span>${esc(l)}</span><div class="track"><div class="fill" style="width:${Math.max(2,v/max*100)}%"></div></div><b>${t??v}</b></${k!=null?"button":"div"}>`).join("");
const banner=()=>`<div class="banner"><span class="chip">Simulated / Portfolio Demo Data</span><span class="chip n">Senior Marketing Specialist · 4.5+ years</span></div>`;
const head=(t,s)=>`<h1>${t}</h1><p class="sub">${s}</p>${banner()}`;
// ---- pages ----
function dash(){
 const k=(l,v,go)=>`<button class="kpi" data-go="${go}"><b>${v}</b><span>${l}</span></button>`;
 return head("B2B demand generation dashboard","From ICP to pipeline. Select any KPI to open the module behind it. Metrics are summed from the five demo campaigns.")+
 `<h4>Activity</h4><div class="grid k">${k("Target accounts",T.acc.toLocaleString(),"acct")}${k("Prospects",T.pros.toLocaleString(),"cont")}${k("Contacts reached",T.contacts.toLocaleString(),"camp")}${k("Emails sent",T.sent.toLocaleString(),"camp")}</div>
 <h4>Engagement</h4><div class="grid k">${k("Delivery rate",pct(T.del,T.sent),"camp")}${k("Open rate",pct(T.open,T.del),"camp")}${k("Click rate",pct(T.click,T.del),"camp")}${k("Reply rate",pct(T.reply,T.del),"camp")}${k("Positive reply rate",pct(T.pos,T.del),"camp")}${k("Meetings booked",T.meet,"camp")}${k("Engaged prospects",T.eng,"funnel")}</div>
 <h4>Conversion</h4><div class="grid k">${k("Contact → lead",pct(T.leads,T.contacts),"funnel")}${k("Lead → qualified",pct(T.qual,T.leads),"funnel")}${k("Qualified → demo",pct(T.demos,T.qual),"funnel")}${k("Demo → opportunity",pct(T.opps,T.demos),"funnel")}${k("Contact → opportunity",pct(T.opps,T.contacts),"funnel")}</div>
 <h4>Pipeline</h4><div class="grid k">${k("Leads generated",T.leads,"lead")}${k("Qualified leads",T.qual,"qual")}${k("Demos booked",T.demos,"pipe")}${k("Opportunities",T.opps,"pipe")}${k("Pipeline value",fm(T.pipe),"pipe")}</div><br>
 <div class="grid two"><div class="card"><h2>Funnel volume</h2>${bars(FUN.slice(2,8).map(f=>[f[0],f[1]]),T.contacts)}<p><button class="btn g" data-go="funnel">Open funnel analytics</button></p></div>
 <div class="card"><h2>Pipeline by campaign</h2>${bars(CAMP.map(c=>[c.name,c.pipe,fm(c.pipe)]),Math.max(...CAMP.map(c=>c.pipe)))}<p><button class="btn g" data-go="camp">Open campaigns</button></p></div></div>`}
function icp(){
 const chips=(g,l)=>`<h4>${l}</h4><div class="chips">${ICPOPT[g].map(o=>`<button data-icp="${g}|${esc(o)}" aria-pressed="${ICP[g].includes(o)}">${esc(o)}</button>`).join("")}</div>`;
 const sc=A.map(fit),avg=Math.round(sc.reduce((a,b)=>a+b,0)/sc.length),hi=A.filter(a=>fit(a)>=80);
 const best=A.slice().sort((a,b)=>fit(b)-fit(a))[0];
 return head("ICP builder","Choose the geographies, industries, company sizes and buying signals that define a good-fit account. Every account score in the app recalculates from this selection.")+
 `<div class="split"><div class="card">${chips("geo","Geography")}${chips("ind","Industries")}${chips("size","Company size (employees)")}${chips("sig","Buying signals")}
 <p class="sub">Persona focus: CIO, CISO, Chief Digital Officer, Compliance Head, QA Head, Procurement Head, Operations Head.</p></div>
 <aside class="card"><h2>ICP fit</h2><div class="big">${avg}/100</div><p>${tag(avg>=80?"High":avg>=50?"Medium":"Low")} average fit across ${A.length} demo accounts</p>
 <dl><dt>High-fit</dt><dd>${hi.length} accounts (80+)</dd><dt>Top account</dt><dd>${esc(best.name)} (${fit(best)})</dd><dt>Why</dt><dd>${best.name} matches industry (${ICP.ind.includes(best.ind)?"yes":"no"}), geography (${ICP.geo.includes(best.geo)?"yes":"no"}), size (${ICP.size.includes(best.size)?"yes":"no"}) and signal "${esc(best.sig)}" (${ICP.sig.includes(best.sig)?"yes":"no"}).</dd><dt>Scoring</dt><dd>Industry 30, signal 30, geography 20, size 20. This is a demo framework.</dd></dl>
 <p style="margin-top:12px"><button class="btn" data-go="acct">Review matching accounts</button></p></aside></div>`}
const sel=(id,l,opts,v)=>`<label>${l}<select id="${id}"><option value="">All</option>${opts.map(o=>`<option ${v===o?"selected":""}>${o}</option>`).join("")}</select></label>`;
function acct(){
 const rows=A.filter(a=>(!S.q||a.name.toLowerCase().includes(S.q.toLowerCase()))&&(!S.ind||a.ind===S.ind)&&(!S.geo||a.geo===S.geo)&&(!S.pri||pri(a)===S.pri)).sort((a,b)=>fit(b)-fit(a));
 const a=A.find(x=>x.id===S.sel);const cs=a?CT.filter(c=>c.acct===a.id):[];
 return head("Account intelligence","Fictional demo companies scored against your ICP. Priority comes from the fit score.")+
 `<div class="tools"><label>Search<input id="q" value="${esc(S.q)}" placeholder="Company name"></label>${sel("f-ind","Industry",ICPOPT.ind,S.ind)}${sel("f-geo","Geography",ICPOPT.geo,S.geo)}${sel("f-pri","Priority",["High","Medium","Low"],S.pri)}</div>
 <div class="split"><div class="card tbl">${rows.length?`<table><thead><tr><th>Company</th><th>Industry</th><th>Geography</th><th>Employees</th><th>Revenue</th><th>ICP score</th><th>Buying signal</th><th>Contacts</th><th>Lead status</th><th>Priority</th></tr></thead><tbody>${rows.map(r=>`<tr tabindex="0" data-acct="${r.id}" class="${S.sel===r.id?"sel":""}"><td>${esc(r.name)}</td><td>${r.ind}</td><td>${r.geo}</td><td>${r.size}</td><td>${r.rev}</td><td>${fit(r)}</td><td>${esc(r.sig)}</td><td>${CT.filter(c=>c.acct===r.id).length}</td><td>${tag(aStatus(r))}</td><td>${tag(pri(r))}</td></tr>`).join("")}</tbody></table>`:`<div class="empty">No accounts match these filters. Clear a filter or adjust the ICP.</div>`}</div>
 <aside class="card">${a?`<h2>${esc(a.name)}</h2><dl><dt>ICP score</dt><dd>${fit(a)}/100 ${tag(pri(a))}</dd><dt>Signal</dt><dd>${esc(a.sig)}</dd><dt>Persona coverage</dt><dd>${[...new Set(cs.map(c=>c.persona))].join(", ")}</dd><dt>Contacts</dt><dd>${cs.map(c=>esc(c.name)+" ("+c.status+")").join("<br>")}</dd></dl><p style="margin-top:12px"><button class="btn" data-go="cont">Open contacts</button></p>`:`<div class="empty">Select an account to see persona coverage and contacts.</div>`}</aside></div>`}
function contTable(rows,lead){return rows.length?`<table><thead><tr><th>Name</th><th>Title</th><th>Company</th><th>Persona</th><th>Campaign</th><th>Score</th><th>Class</th><th>Status</th></tr></thead><tbody>${rows.map(c=>`<tr tabindex="0" data-c="${c.id}" class="${S.sel===c.id?"sel":""}"><td>${esc(c.name)}</td><td>${c.title}</td><td>${esc(A[c.acct].name)}</td><td>${c.persona}</td><td>${esc(CP[c.camp])}</td><td>${c.score}</td><td>${tag(band(c.score))}</td><td>${tag(c.status)}</td></tr>`).join("")}</tbody></table>`:`<div class="empty">${lead?"No leads currently match this status.":"No contacts match your search."}</div>`}
function cPanel(){const c=CT.find(x=>x.id===S.sel);if(!c)return `<div class="empty">Select a contact to see lead score, campaign and next action.</div>`;const a=A[c.acct],i=ST.indexOf(c.status),nx=ST[i+1],can=i<7;
 return `<h2>${esc(c.name)}</h2><dl><dt>Title</dt><dd>${c.title}, ${esc(a.name)}</dd><dt>Industry</dt><dd>${a.ind}, ${a.geo}</dd><dt>Decision-maker</dt><dd>${DEC.includes(c.persona)?"Decision-maker or key influencer":"Influencer"}</dd><dt>Lead score</dt><dd>${c.score}/100 ${tag(band(c.score))}</dd><dt>Campaign</dt><dd>${esc(CP[c.camp])}</dd><dt>Status</dt><dd>${tag(c.status)}</dd><dt>Next action</dt><dd>${c.status==="Disqualified"?"None. Excluded from outreach.":c.status==="Nurture"?"Add to quarterly nurture email.":c.score>=80?"Sales follow-up within 24 hours.":"Continue sequence and monitor engagement."}</dd></dl>${can?`<p style="margin-top:12px"><button class="btn" data-adv="${c.id}">Move to ${nx}</button></p>`:""}<p class="sub" style="margin-top:10px">Demo scoring: industry 20, size 10, geography 10, decision-maker 20, open 5, click 10, reply 15, demo request 30. Hot 80+, Warm 60–79, Nurture 40–59.</p>`}
function cont(){const rows=CT.filter(c=>(!S.q||(c.name+A[c.acct].name).toLowerCase().includes(S.q.toLowerCase()))&&(!S.st||c.status===S.st));
 return head("Contact intelligence",`Showing ${rows.length} of ${CT.length} sample contacts from the ${T.pros.toLocaleString()} researched prospects.`)+`<div class="tools"><label>Search<input id="q" value="${esc(S.q)}" placeholder="Name or company"></label>${sel("f-st","Status",ST,S.st)}</div><div class="split"><div class="card tbl">${contTable(rows)}</div><aside class="card">${cPanel()}</aside></div>`}
function lead(){const rows=CT.filter(c=>LEADST.includes(c.status)&&(!S.st||c.status===S.st));
 return head("Lead pipeline","Sample leads that replied or progressed. Select a lead and move it to the next stage.")+`<div class="chips">${["",...LEADST].map(s=>`<button data-st="${s}" aria-pressed="${S.st===s}">${s||"All"} (${CT.filter(c=>LEADST.includes(c.status)&&(!s||c.status===s)).length})</button>`).join("")}</div><div class="split"><div class="card tbl">${contTable(rows,1)}</div><aside class="card">${cPanel()}</aside></div>`}
function camp(){const c=CAMP[S.camp],best=CAMP.slice().sort((a,b)=>b.pipe-a.pipe)[0].id;
 const fn=[["Contacts",c.contacts],["Emails sent",c.sent],["Delivered",c.del],["Opened",c.open],["Clicked",c.click],["Replied",c.reply],["Positive reply",c.pos],["Meeting",c.meet],["Qualified lead",c.qual]];
 return head("Campaign overview and email analytics","Select a campaign to see its email funnel. Highest pipeline is marked Top.")+
 `<div class="card tbl"><table><thead><tr><th>Campaign</th><th>Status</th><th>Contacts</th><th>Delivered</th><th>Open rate</th><th>Reply rate</th><th>Positive replies</th><th>Leads</th><th>Qualified</th><th>Demos</th><th>Opps</th><th>Pipeline</th></tr></thead><tbody>${CAMP.map(r=>`<tr tabindex="0" data-camp="${r.id}" class="${S.camp===r.id?"sel":""}"><td>${esc(r.name)} ${r.id===best?tag("Top"):""}</td><td>${r.status}</td><td>${r.contacts}</td><td>${pct(r.del,r.sent)}</td><td>${pct(r.open,r.del)}</td><td>${pct(r.reply,r.del)}</td><td>${r.pos}</td><td>${r.leads}</td><td>${r.qual}</td><td>${r.demos}</td><td>${r.opps}</td><td>${fm(r.pipe)}</td></tr>`).join("")}</tbody></table></div><br>
 <div class="card"><h2>Email funnel: ${esc(c.name)}</h2>${bars(fn.map(f=>[f[0],f[1],f[1]+" ("+pct(f[1],c.contacts)+")"]),c.contacts)}</div>`}
function funnel(){const i=S.stage,f=FUN[i],p=FUN[i-1];
 return head("Funnel analytics","Select a stage to see its conversion, drop-off and business value.")+`<div class="split"><div class="card">${bars(FUN.map((f,k)=>[f[0],f[1],k===8?fm(f[1]):f[1].toLocaleString(),k]),T.pros,i)}</div><aside class="card"><h2>${f[0]}</h2><dl><dt>Volume</dt><dd>${i===8?fm(f[1]):f[1].toLocaleString()}</dd><dt>Definition</dt><dd>${f[2]}</dd>${p?`<dt>Conversion</dt><dd>${pct(f[1],p[1])} of ${p[0].toLowerCase()}</dd><dt>Drop-off</dt><dd>${(100-f[1]/p[1]*100).toFixed(1)}%</dd>`:""}<dt>Business value</dt><dd>${i<4?"Coverage: the pool outreach can reach.":i<7?"Demand: leads that sales can act on.":"Revenue potential: "+fm(T.pipe)+" open pipeline."}</dd><dt>Action</dt><dd>${i===3?"Tighten subject lines and CTA to lift replies.":i===4?"Add qualification questions to the reply flow.":i===6?"Reduce demo no-shows with reminder touches.":"Review the segment mix feeding this stage."}</dd></dl></aside></div>`}
function qual(){const L=CT.filter(c=>LEADST.includes(c.status)),h=L.filter(c=>c.score>=80).length,m=L.filter(c=>c.score>=60&&c.score<80).length,lo=L.length-h-m,dq=L.filter(c=>c.status==="Disqualified").length;
 const bi=[...new Set(A.map(a=>a.ind))].map(i=>{const x=L.filter(c=>A[c.acct].ind===i);return [i,x.length?Math.round(x.filter(c=>c.score>=80).length/x.length*100):0,x.length]});
 const bc=CAMP.map(c=>[c.name,c.qual/c.leads*100,pct(c.qual,c.leads)]);const top=bc.slice().sort((a,b)=>b[1]-a[1])[0];
 return head("Lead quality",`Sample of ${L.length} leads (${dq} disqualified). Campaign rates use the full demo totals: ${T.qual} qualified of ${T.leads} leads (${pct(T.qual,T.leads)}).`)+
 `<div class="grid two"><div class="card"><h2>Quality mix (sample leads)</h2>${bars([["High quality (80+)",h,Math.round(h/L.length*100)+"%"],["Medium (60–79)",m,Math.round(m/L.length*100)+"%"],["Low (<60)",lo,Math.round(lo/L.length*100)+"%"]],L.length)}</div>
 <div class="card"><h2>Qualification rate by campaign</h2>${bars(bc,100)}</div>
 <div class="card"><h2>High-quality share by industry (sample)</h2>${bi.map(([i,v,n])=>`<div class="row"><span>${i}</span><div class="track"><div class="fill" style="width:${Math.max(2,v)}%"></div></div><b>${n?v+"%":"–"}</b></div>`).join("")}</div>
 <div class="card"><h2>Recommendations</h2><ul><li>Increase decision-maker targeting in pharma and healthcare, where high-quality leads cluster.</li><li>Reduce outreach to low-fit accounts such as HR-led contacts at small FMCG firms.</li><li>${esc(top[0])} qualifies best (${top[2]}); shift volume toward it.</li><li>Add a budget and timeline question to qualification to cut low-quality replies.</li></ul></div></div>`}
function pipe(){const r=[["Lead → MQL",pct(T.qual,T.leads)],["MQL → demo",pct(T.demos,T.qual)],["Demo → opportunity",pct(T.opps,T.demos)]];const k=(l,v)=>`<div class="card kpi"><b>${v}</b><span>${l}</span></div>`;
 return head("Pipeline impact","Marketing activity becomes qualified demand, then pipeline. Won revenue is not reported in this demo.")+
 `<div class="grid k">${k("Leads",T.leads)}${k("MQLs",T.qual)}${k("Demos",T.demos)}${k("Opportunities",T.opps)}${k("Pipeline",fm(T.pipe))}${r.map(x=>k(x[0],x[1])).join("")}</div><br>
 <div class="grid two"><div class="card"><h2>Marketing activity → qualified demand → pipeline</h2>${bars([["Emails sent",T.sent],["Engaged",T.eng],["Leads",T.leads],["Qualified demand",T.qual],["Demos",T.demos],["Opportunities",T.opps]],T.sent)}</div>
 <div class="card"><h2>Pipeline by campaign</h2>${CAMP.map(c=>`<div class="row"><span>${esc(c.name)}</span><div class="track"><div class="fill" style="width:${c.pipe/T.pipe*100}%"></div></div><b>${fm(c.pipe)}</b></div>`).join("")}<p class="sub">Pipeline per demo: ${fm(Math.round(T.pipe/T.demos))}. Opportunities per 1,000 contacts: ${(T.opps/T.contacts*1000).toFixed(1)}.</p></div></div>`}
// ---- shell ----
function render(){$("#nav").innerHTML=NAV.map(n=>n.length===1?`<h3>${n[0]}</h3>`:`<button data-p="${n[0]}" ${S.page===n[0]?'aria-current="page"':""}>${n[1]}</button>`).join("");
 try{$("#app").innerHTML={dash,icp,acct,cont,lead,camp,funnel,qual,pipe}[S.page]()}catch(e){$("#app").innerHTML=`<div class="card empty">Something went wrong loading this module (${esc(e.message)}). Choose another page from the menu and try again.</div>`}}
function go(p){S.page=p;S.q="";S.st="";S.sel=null;location.hash=p;render();scrollTo(0,0)}
function keep(f){const y=scrollY;render();scrollTo(0,y);if(f){const e=$("#"+f);e.focus();e.setSelectionRange(e.value.length,e.value.length)}}
document.addEventListener("click",e=>{const t=e.target.closest("[data-p],[data-go],[data-icp],[data-acct],[data-c],[data-camp],[data-stage],[data-st],[data-adv]");if(!t)return;const d=t.dataset;
 if(d.p||d.go)return go(d.p||d.go);
 if(d.icp){const[g,o]=d.icp.split("|"),l=ICP[g],i=l.indexOf(o);i<0?l.push(o):l.splice(i,1);toast("ICP updated: account scores recalculated");return keep()}
 if(d.acct){S.sel=+d.acct}if(d.c){S.sel=+d.c}if(d.camp){S.camp=+d.camp}if(d.stage){S.stage=+d.stage}if(d.st!==undefined&&t.hasAttribute("data-st"))S.st=d.st;
 if(d.adv){const c=CT[+d.adv];c.status=ST[ST.indexOf(c.status)+1];toast(c.name+" moved to "+c.status)}
 keep()});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches("tr[tabindex]")){e.preventDefault();e.target.click()}});
document.addEventListener("input",e=>{if(e.target.id==="q"){S.q=e.target.value;keep("q")}});
document.addEventListener("change",e=>{const m={"f-ind":"ind","f-geo":"geo","f-pri":"pri","f-st":"st"}[e.target.id];if(m){S[m]=e.target.value;keep()}});
S.page=PAGES[location.hash.slice(1)]?location.hash.slice(1):"dash";render();
</script></body></html>
